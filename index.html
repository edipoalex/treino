<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino</title>
<meta name="description" content="Ficha de treino com acompanhamento da sequência">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/sessao.css">
<link rel="stylesheet" href="css/telas.css">
<link rel="stylesheet" href="css/habito.css">
<link rel="stylesheet" href="css/acabamento.css">
<link rel="stylesheet" href="css/movimento.css">
</head>
<body>
<!-- gradientes das anilhas (js/anilha.js) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <radialGradient id="an-luz" cx="30%" cy="22%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient>
  <linearGradient id="an-me" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F6F8"/><stop offset=".45" stop-color="#B9C0C7"/><stop offset=".55" stop-color="#9AA2AA"/><stop offset="1" stop-color="#E2E6EA"/></linearGradient>
  <radialGradient id="an-fu" cx="50%" cy="35%" r="65%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
  <linearGradient id="an-lat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".18" stop-color="#000" stop-opacity=".55"/><stop offset=".5" stop-color="#000" stop-opacity=".3"/><stop offset=".82" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></linearGradient>
  <linearGradient id="an-parede" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b2026"/><stop offset=".35" stop-color="#4a525b"/><stop offset=".62" stop-color="#9aa2aa"/><stop offset="1" stop-color="#d9dee3"/></linearGradient>
  <clipPath id="an-furo-frente"><circle cx="50" cy="50" r="9"/></clipPath>
  <mask id="an-vazado" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120"><rect x="-10" y="-10" width="120" height="120" fill="#fff"/><circle cx="59.5" cy="50" r="9" fill="#000" clip-path="url(#an-furo-frente)"/></mask>
</defs></svg>
<header class="top">
  <div class="wrap">
    <p class="brand"><span id="brandTxt">Treino</span> <small id="weekLbl"></small></p>
    <span class="spacer"></span>
    <button class="icon-btn" id="openSettings" aria-label="Ajustes" style="position:relative"><span class="sync-dot" id="syncDot" hidden></span>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Navegação principal">
  <div class="wrap">
    <button class="tab" data-tab="hoje"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>Hoje</button>
    <button class="tab" data-tab="ficha"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>Ficha</button>
    <button class="tab" data-tab="historico"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg>Histórico</button>
    <button class="tab" data-tab="guia"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>Guia</button>
  </div>
</nav>

<dialog id="settings" aria-labelledby="setTitle">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="setTitle">Ajustes</h2>
    <div class="field">
      <label>Tema</label>
      <div class="seg" id="themeSeg">
        <button data-theme-opt="auto">Automático</button><button data-theme-opt="light">Claro</button><button data-theme-opt="dark">Escuro</button>
      </div>
    </div>
    <div class="field">
      <label>Modo do treino</label>
      <div class="seg" id="modoSeg"><button data-pref-modo="lista">Lista</button><button data-pref-modo="foco">Foco</button></div>
      <p class="meta" style="font-size:14px">Lista: todos os exercícios na tela. Foco: um exercício por vez.</p>
    </div>
    <div class="field">
      <label>Descanso</label>
      <div class="seg" id="descSeg"><button data-pref-desc="botao">No botão</button><button data-pref-desc="tela">Tela cheia</button></div>
      <p class="meta" style="font-size:14px">No botão: o botão da série vira o cronômetro. Tela cheia: mostra a próxima série e a carga.</p>
    </div>
    <div class="field">
      <label>Animações</label>
      <div class="seg" id="animSeg"><button data-pref-anim="completas">Completas</button><button data-pref-anim="reduzidas">Reduzidas</button></div>
      <p class="meta" style="font-size:14px">Reduzidas: sem transições nem efeitos. O "reduzir movimento" do celular também desliga.</p>
    </div>
    <div class="field">
      <label for="startDate">Início da etapa (define semana e fase)</label>
      <input type="date" id="startDate">
    </div>
    <div class="field">
      <label for="phaseMode">Fase</label>
      <select id="phaseMode">
        <option value="auto">Automática pela contagem de treinos</option>
        <option value="1">Sempre fase 1</option>
        <option value="2">Sempre fase 2</option>
      </select>
    </div>
    <div class="field">
      <label>Meta de peso</label>
      <div class="row">
        <div class="kgfield" style="flex:1"><input id="metaKg" inputmode="decimal" placeholder="—" aria-label="Meta em kg"><span>kg</span></div>
        <input type="date" id="metaData" aria-label="Data da meta" style="flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px;min-width:0">
      </div>
    </div>
    <div class="field">
      <label>Planilha Google (fonte dos dados)</label>
      <div class="sync-box" id="syncBox"></div>
    </div>
    <div class="field">
      <label>Backup dos dados deste aparelho</label>
      <div class="row">
        <button class="btn" id="exportBtn" style="flex:1">Exportar</button>
        <label class="btn" style="flex:1;font-weight:600" for="importFile">Importar</label>
        <input type="file" id="importFile" accept="application/json" class="sr">
      </div>
    </div>
    <div class="stack">
      <button class="btn block danger" id="resetBtn">Apagar histórico desta etapa</button>
      <button class="btn block primary" id="closeSettings">Fechar</button>
    </div>
    <p class="versao" id="versaoTxt"></p>
  </div>
</dialog>
<div class="nova-versao" id="novaVersao" hidden><span>Nova versão do app disponível</span><button class="btn" id="atualizarApp">Atualizar</button></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
