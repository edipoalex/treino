<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino</title>
<meta name="description" content="Ficha de treino com acompanhamento da sequência">
<meta name="theme-color" content="#E8EBEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/sessao.css">
<link rel="stylesheet" href="css/telas.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="brand"><span id="brandTxt">Treino</span> <small id="weekLbl"></small></p>
    <span class="spacer"></span>
    <button class="icon-btn" id="openSettings" aria-label="Ajustes" style="position:relative"><span class="sync-dot" id="syncDot" hidden></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Navegação principal">
  <div class="wrap">
    <button class="tab" data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Hoje</button>
    <button class="tab" data-tab="ficha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Ficha</button>
    <button class="tab" data-tab="historico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Histórico</button>
    <button class="tab" data-tab="guia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>Guia</button>
  </div>
</nav>

<dialog id="settings" aria-labelledby="setTitle">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="setTitle">Ajustes</h2>
    <div class="field">
      <label>Tema</label>
      <div class="seg" id="themeSeg">
        <button data-theme-opt="auto">Automático</button><button data-theme-opt="light">Claro</button><button data-theme-opt="dark">Escuro</button>
      </div>
    </div>
    <div class="field">
      <label>Modo do treino</label>
      <div class="seg" id="modoSeg"><button data-pref-modo="lista">Lista</button><button data-pref-modo="foco">Foco</button></div>
      <p class="meta" style="font-size:14px">Lista: todos os exercícios na tela. Foco: um exercício por vez.</p>
    </div>
    <div class="field">
      <label>Descanso</label>
      <div class="seg" id="descSeg"><button data-pref-desc="botao">No botão</button><button data-pref-desc="tela">Tela cheia</button></div>
      <p class="meta" style="font-size:14px">No botão: o botão da série vira o cronômetro. Tela cheia: mostra a próxima série e a carga.</p>
    </div>
    <div class="field">
      <label for="startDate">Início da etapa (define semana e fase)</label>
      <input type="date" id="startDate">
    </div>
    <div class="field">
      <label for="phaseMode">Fase</label>
      <select id="phaseMode">
        <option value="auto">Automática pela contagem de treinos</option>
        <option value="1">Sempre fase 1</option>
        <option value="2">Sempre fase 2</option>
      </select>
    </div>
    <div class="field">
      <label>Meta de peso</label>
      <div class="row">
        <div class="kgfield" style="flex:1"><input id="metaKg" inputmode="decimal" placeholder="—" aria-label="Meta em kg"><span>kg</span></div>
        <input type="date" id="metaData" aria-label="Data da meta" style="flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px;min-width:0">
      </div>
    </div>
    <div class="field">
      <label>Planilha Google (fonte dos dados)</label>
      <div class="sync-box" id="syncBox"></div>
    </div>
    <div class="field">
      <label>Backup dos dados deste aparelho</label>
      <div class="row">
        <button class="btn" id="exportBtn" style="flex:1">Exportar</button>
        <label class="btn" style="flex:1;font-weight:600" for="importFile">Importar</label>
        <input type="file" id="importFile" accept="application/json" class="sr">
      </div>
    </div>
    <div class="stack">
      <button class="btn block danger" id="resetBtn">Apagar histórico desta etapa</button>
      <button class="btn block primary" id="closeSettings">Fechar</button>
    </div>
    <p class="versao" id="versaoTxt"></p>
  </div>
</dialog>
<div class="nova-versao" id="novaVersao" hidden><span>Nova versão do app disponível</span><button class="btn" id="atualizarApp">Atualizar</button></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
