name: Validar app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Módulos, ficha, tempos e versões
        run: node scripts/validar.mjs --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - name: Testes unitários do app
        run: node --test tests/*.test.js
      - name: Testes do Apps Script (planilha simulada)
        run: node scripts/testar-planilha.mjs
      - name: Capturas das telas (teste visual)
        run: node scripts/capturas.mjs capturas
      - name: Guardar as capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-das-telas
          path: capturas/*.png
